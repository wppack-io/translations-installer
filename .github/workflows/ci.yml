name: CI

on:
  push:
    branches: ['[0-9]+.x']
  pull_request:

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/phpunit

      - run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      # A real project that consumes the plugin from this checkout and
      # installs a wordpress.org plugin, so the whole flow runs against the
      # live translations API.
      - name: Create test project
        run: |
          mkdir project && cd project
          cat > composer.json <<'EOF'
          {
              "repositories": [
                  { "type": "path", "url": "../plugin" },
                  { "type": "composer", "url": "https://wpackagist.org" }
              ],
              "require": {
                  "wppack/translations-installer": "@dev",
                  "wpackagist-plugin/query-monitor": "*"
              },
              "extra": {
                  "wordpress-translations": ["ja"],
                  "wordpress-translations-dir": "languages"
              },
              "config": {
                  "allow-plugins": {
                      "wppack/translations-installer": true,
                      "composer/installers": true
                  }
              }
          }
          EOF

      - name: Install the test project
        working-directory: project
        run: composer install --no-interaction

      - name: Assert translations were downloaded
        run: |
          find project/languages -type f
          test -n "$(find project/languages/plugins -name 'query-monitor-ja*' -print -quit)"

      - name: translations:status reports up to date
        working-directory: project
        run: composer translations:status

      - name: translations:update is a no-op when current
        working-directory: project
        run: composer translations:update

      - name: translations:status detects a stale translation
        working-directory: project
        run: |
          PO_FILE="$(find languages/plugins -name 'query-monitor-ja.po' -print -quit)"
          sed -i 's/"PO-Revision-Date: [^\\]*/"PO-Revision-Date: 2020-01-01 00:00:00+0000/' "$PO_FILE"
          if composer translations:status; then
            echo 'expected exit 1 for a stale translation' >&2; exit 1
          fi

      - name: translations:update refreshes the stale translation
        working-directory: project
        run: |
          composer translations:update
          composer translations:status
